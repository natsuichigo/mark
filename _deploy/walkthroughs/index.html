<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Walkthroughs — Mark</title>
    <meta name="description" content="Slide-deck tours of Mark's projects.">
    <link rel="stylesheet" href="../assets/hub.css">
    <link rel="stylesheet" href="../assets/site-chrome.css">

    <!-- site chrome config -->
    <meta name="sc-portal" content="../index.html">
    <meta name="sc-type"   content="hub">
    <meta name="sc-active" content="walkthroughs">
    <script src="../assets/site-chrome.js" defer></script>
</head>
<body>
    <main class="panel">
        <section class="hero" aria-label="Page header">
            <img class="brand-logo" src="../assets/logo.svg" alt="Mark">
            <h1>Walkthroughs</h1>
            <p class="subtitle">Slide-deck tours of my projects. Use the arrow keys to move through a deck.</p>
        </section>

        <!-- One card per deck. The docs-to-deck skill builds the deck under
             ../presentations/<slug>/; adding its card here is a hand edit. -->
        <section class="links" aria-label="Walkthrough decks">

            <a class="card" href="../presentations/portfolio-site/index.html">
                <div class="icon-badge alt" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                </div>
                <h2>This Portfolio Site</h2>
                <p>How a static site with no build step is written in Markdown, generated by Claude Code skills and deployed by GitHub Actions.</p>
                <span class="btn alt">→ Open slides</span>
            </a>

        </section>

        <p class="meta">Mark — DevOps &amp; Platform Engineer</p>
    </main>
</body>
</html>
